name: MLOps End-to-End Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: 'Tahap 1: Automated Testing'
      run: |
        pytest tests/

    - name: 'Tahap 2: Automated Retraining'
      run: |
        python src/ingest_data.py
        python src/preprocess.py
        python src/train.py

    - name: 'Tahap 3 & 4: Model Evaluation & Auto-Registry Update'
      run: |
        python src/models/evaluate.py