global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "btc-inference-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "mlops-bitcoin-volatility-prediction-api-service-1:8000"
          - "mlops-bitcoin-volatility-prediction-api-service-2:8000"
          - "mlops-bitcoin-volatility-prediction-api-service-3:8000"
